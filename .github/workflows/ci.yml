name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (api, liff, shared)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  bot:
    name: Python (bot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bot
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  infra:
    name: Infra (terraform, scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra test
      - run: npm run test:infra

  images:
    name: Container images (api, bot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build images
        run: |
          docker build -f apps/api/Dockerfile -t gac-api .
          docker build -t gac-bot apps/bot
      - name: Smoke test images
        run: |
          # api needs env to start; all values are obviously fake. postgres.js
          # connects lazily, so /health works without a database.
          api_env=(
            -e DATABASE_URL=postgres://ci:ci@127.0.0.1:1/ci
            -e SESSION_SECRET=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
            -e LINE_LOGIN_CHANNEL_ID=0
            -e BOT_SA_EMAIL=ci@example.iam.gserviceaccount.com
            -e INTERNAL_AUDIENCE=gac-api-internal
            -e CORS_ORIGIN=https://example.web.app
            -e BOT_URL=https://bot.example.run.app
            -e BOT_AUDIENCE=gac-bot-internal
          )
          for svc in api bot; do
            extra=()
            if [ "$svc" = api ]; then extra=("${api_env[@]}"); fi
            docker run -d --name "$svc" -e PORT=8080 "${extra[@]}" -p 8080:8080 "gac-$svc"
            ok=0
            for _ in $(seq 1 20); do
              if body=$(curl -fsS localhost:8080/health 2>/dev/null); then ok=1; break; fi
              sleep 1
            done
            if [ "$ok" != 1 ] || [ "$body" != "{\"status\":\"ok\",\"service\":\"$svc\"}" ]; then
              echo "health check failed for $svc: ${body:-no response}"
              docker logs "$svc"
              exit 1
            fi
            echo "$svc ok: $body"
            docker rm -f "$svc"
          done
