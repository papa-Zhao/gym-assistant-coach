name: Rich Menu

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: richmenu
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

jobs:
  publish:
    name: Render and publish rich menu
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Render rich menu image
        run: >-
          google-chrome --headless=new --disable-gpu --hide-scrollbars
          --window-size=2500,1686 --virtual-time-budget=5000
          --screenshot=richmenu.png "file://$PWD/apps/bot/richmenu/richmenu.html"
      - uses: actions/upload-artifact@v5
        with:
          name: richmenu
          path: richmenu.png
          if-no-files-found: error
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: astral-sh/setup-uv@v6
      - name: Publish rich menu
        working-directory: apps/bot
        env:
          LIFF_ID: ${{ vars.LIFF_ID }}
          RICHMENU_IMAGE: ${{ github.workspace }}/richmenu.png
        run: |
          uv sync --locked
          token=$(gcloud secrets versions access latest --secret=line-channel-access-token --project "$GCP_PROJECT_ID")
          echo "::add-mask::$token"
          LINE_CHANNEL_ACCESS_TOKEN="$token" uv run python -m app.richmenu
