[project]
name = "gac-bot"
version = "0.0.0"
description = "Gym Assistant Coach LINE bot service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.1",
    "google-auth>=2.62.0",
    "httpx>=0.28.1",
    "line-bot-sdk>=3.26.0",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
