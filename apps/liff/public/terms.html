<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>服務條款 - Gym Assistant Coach</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@900&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Static page, cannot import TS: these hex values mirror packages/shared/src/tokens.ts (light colors). */
      body {
        margin: 0;
        background: #fbf6ee;
        color: #2b2420;
        font-family: "Noto Sans TC", system-ui, sans-serif;
        font-size: 16px;
        line-height: 1.8;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 24px 16px;
      }
      .card {
        background: #fffdf8;
        border: 1px solid #e6dccd;
        border-radius: 24px;
        padding: 24px;
      }
      .draft {
        background: #f1e3d6;
        color: #8f3920;
        border-radius: 12px;
        padding: 12px 16px;
        font-weight: 700;
        margin: 0 0 16px;
      }
      h1 {
        font-family: "Noto Serif TC", serif;
        font-weight: 900;
        font-size: 22px;
        margin: 0 0 8px;
      }
      h2 {
        font-size: 18px;
        margin: 24px 0 4px;
      }
      .meta {
        color: #6b5e55;
        font-size: 13px;
        margin: 0 0 16px;
      }
      ul {
        padding-left: 20px;
        margin: 4px 0;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <p class="draft">草稿，上線前需法律審閱</p>
        <h1>服務條款</h1>
        <p class="meta">版本 2026-10-19</p>
        <h2>1. 適用對象</h2>
        <p>
          本服務僅限年滿 18 歲的使用者使用。使用本服務即表示你確認自己已年滿 18
          歲。
        </p>
        <h2>2. 非醫療建議</h2>
        <p>
          本服務提供的訓練與飲食內容僅供一般健身參考，不構成醫療、診斷或治療建議。若有健康疑慮或身體不適，請先諮詢合格的醫療專業人員。
        </p>
        <h2>3. 服務可能變更</h2>
        <p>
          [營運者名稱]得隨時調整、暫停或終止部分或全部服務內容，並會盡可能事先通知。
        </p>
        <h2>4. 濫用處理</h2>
        <p>
          若發現濫用、干擾系統運作或違反本條款的行為，[營運者名稱]得限制或停止該帳號使用本服務。
        </p>
        <h2>5. 聯絡方式</h2>
        <p>如有問題，請來信 [聯絡信箱]。</p>
      </div>
    </main>
  </body>
</html>
